# Weekly check for security and version updates of the test tools and GitHub Actions.
# Each update arrives as a pull request that must pass the Quality checks before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: npm
    directory: /workers/arv-worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
