name: Deploy static site to GitHub Pages

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful exact-commit Quality on current main
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const {verifyDeployment}=require('./scripts/verify-pages-deploy.cjs');
            const candidate=context.eventName==='workflow_run'?context.payload.workflow_run.head_sha:context.sha;
            const {data:main}=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'quality.yml',head_sha:candidate,event:'push',per_page:100});
            const sha=verifyDeployment({eventName:context.eventName,event:context.payload,sha:context.sha,ref:context.ref,
              repository:context.repo.owner+'/'+context.repo.repo,mainSha:main.object.sha,runs:data.workflow_runs});
            core.setOutput('sha',sha);

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site/tools/arv public-site/calculadora-venta
          cp index.html login.html admin.html account.html pricing.html privacy.html style.css lang.js script.js robots.txt sitemap.xml manifest.webmanifest public-site/
          cp -R assets public-site/assets
          # Do not deploy deprecated front-end authentication or unused gating scripts.
          rm -f public-site/assets/js/login.js public-site/assets/js/tool-access-guard.js
          cp tools/*.html tools/*.css tools/tool-script.js tools/tool-access-feedback.js public-site/tools/
          cp tools/arv/index.html tools/arv/arv.css tools/arv/arv.js public-site/tools/arv/
          cp -R tools/arv/fixtures public-site/tools/arv/fixtures
          cp calculadora-venta/index.html calculadora-venta/print-report.css calculadora-venta/print-report.js public-site/calculadora-venta/
          touch public-site/.nojekyll
          node -e 'require("node:fs").writeFileSync("public-site/build-info.json",JSON.stringify({commit:process.env.IB_DEPLOY_SHA,builtAt:new Date().toISOString()}))'
          # Fail deployment if a calculator is accidentally embedded into a public entry page.
          if grep -q "const STATE_JURISDICTIONS\|function calculateFlip" public-site/calculadora-venta/index.html public-site/tools/flip-calculator.html; then
            echo "::error::A tool entry file includes calculator implementation."
            exit 1
          fi
          test -f public-site/assets/js/secure-tool-loader.js
          test -f public-site/assets/js/member-access.js
          test -f public-site/account.html
          test -f public-site/assets/js/account-settings.js
          test -f public-site/manifest.webmanifest
          test -f public-site/tools/arv/fixtures/demo-report.json
          test ! -e public-site/auth.js
          test ! -e public-site/workers
          test ! -e public-site/preview-login.html
        env:
          IB_DEPLOY_SHA: ${{ steps.gate.outputs.sha }}

      - name: Checkout immutable review candidate
        uses: actions/checkout@v4
        with:
          ref: 189b85ec5fce00dc4a72f4654ea16a99df54a5cf
          path: .review-source

      - name: Require all review-candidate checks before adding preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha='189b85ec5fce00dc4a72f4654ea16a99df54a5cf';
            for(const workflow_id of [239749494,389569613,303749099,390497135]){
              const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:sha,per_page:100});
              const runs=data.workflow_runs.filter(run=>run.head_sha===sha&&run.head_repository?.full_name===context.repo.owner+'/'+context.repo.repo).sort((a,b)=>b.id-a.id);
              if(!runs.length||runs[0].status!=='completed'||runs[0].conclusion!=='success')throw Error('Pinned review candidate has an incomplete or failing workflow: '+workflow_id);
            }

      - name: Add authenticated review copy to its isolated path
        run: node scripts/build-review-preview.mjs .review-source public-site

      - name: Refuse stale build before publishing
        uses: actions/github-script@v7
        env:
          IB_DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
        with:
          script: |
            const {data}=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(data.object.sha!==process.env.IB_DEPLOY_SHA)core.setFailed('Main advanced during build; wait for its successful Quality run.');

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
