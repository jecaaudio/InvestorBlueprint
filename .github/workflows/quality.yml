name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  structure-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test public routes, member forms and PWA assets
        # Runs every scripts/*.test.mjs so new test files are never skipped.
        run: npm test

  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run axe accessibility checks
        run: |
          python3 -u -m http.server 4173 --bind 127.0.0.1 --directory .. &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/InvestorBlueprint/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/InvestorBlueprint/index.html >/dev/null
          npm run qa:axe

      - name: Run Lighthouse CI assertions
        run: npm run qa:lighthouse
