name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

# Tests only read the code; the job token cannot change the repository.
permissions:
  contents: read

jobs:
  structure-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install locked test dependencies
        run: npm ci

      - name: Run offline unit, DOM, seller and report regressions
        # The list lives in package.json "test"; site-smoke fails if a test file is in no list.
        run: npm test

      - name: Verify live protected endpoint refuses missing and forged credentials
        run: node scripts/live-tool-denial.test.mjs

  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run axe accessibility checks
        run: |
          python3 -u -m http.server 4173 --bind 127.0.0.1 --directory .. &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/InvestorBlueprint/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/InvestorBlueprint/index.html >/dev/null
          npm run qa:axe
          node scripts/protected-brand-browser.test.mjs
          node scripts/mobile-header-browser.test.mjs

      - name: Run Lighthouse CI assertions
        run: npm run qa:lighthouse

      - name: Render bilingual print and PDF fixtures in native Chromium
        run: node scripts/report-render-browser.mjs

      - name: Preserve synthetic report previews for visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-report-previews
          path: tmp/report-render-qa/
          retention-days: 7

  mobile-webkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Safari WebKit engine and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Verify member profile persistence in mobile WebKit
        run: |
          python3 -u -m http.server 4173 --bind 127.0.0.1 --directory .. &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/InvestorBlueprint/account.html >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/InvestorBlueprint/account.html >/dev/null
          node scripts/member-webkit.test.mjs
