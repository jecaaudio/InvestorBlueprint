name: ARV Worker

on:
  push:
    paths:
      - "workers/arv-worker/**"
  pull_request:
    paths:
      - "workers/arv-worker/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run worker unit tests
        working-directory: workers/arv-worker
        run: npm test
