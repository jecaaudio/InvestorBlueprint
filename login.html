<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Access | InvestorBlueprint</title>
    <meta name="description" content="Request early access to InvestorBlueprint tools and get notified when new real estate calculators are available." />
    <link rel="canonical" href="https://jecaaudio.github.io/InvestorBlueprint/login.html" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="assets/css/cookie-banner.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand-menu has-primary-nav">
        <a class="logo home-link" href="index.html">InvestorBlueprint</a>
        <div class="brand-dropdown" role="menu" aria-label="Quick navigation">
          <a href="index.html#tools" data-i18n="navTools">Tools</a>
          <a href="index.html#learn" data-i18n="navLearn">Learn</a>
          <a href="pricing.html" data-i18n="navPricing" data-cta-click="Pricing">Pricing</a>
          <a href="login.html" data-i18n="navLogin" data-auth-link>Login</a>
        </div>
      </div>
      <nav id="primary-nav" class="is-open">
        <a href="index.html#tools" data-i18n="navTools">Tools</a>
        <a href="index.html#learn" data-i18n="navLearn">Learn</a>
        <a href="pricing.html" data-i18n="navPricing" data-cta-click="Pricing">Pricing</a>
        <a href="login.html" data-i18n="navLogin" data-auth-link>Login</a>
      </nav>
    </header>

    <main>
      <section id="account-panel" class="section auth-layout auth-layout-single" hidden>
        <article class="card auth-card">
          <h2>My account</h2>
          <p>Signed in as <strong id="account-email"></strong></p>
          <p id="subscription-status"></p>
          <p id="subscription-detail"></p>
          <h3>Saved calculations</h3>
          <ul id="saved-calculations-list"></ul>
          <button id="logout-btn" class="btn btn-secondary" type="button">Log out</button>
        </article>
      </section>

      <section class="section auth-layout auth-layout-single">
        <article class="card auth-card">
          <div class="auth-tabs" role="tablist">
            <button id="tab-register" class="auth-tab is-active" type="button" role="tab" aria-selected="true">Create account</button>
            <button id="tab-login" class="auth-tab" type="button" role="tab" aria-selected="false">Log in</button>
          </div>

          <div id="auth-message" role="status"></div>

          <form id="register-form" class="auth-form" novalidate>
            <label for="register-email">Email</label>
            <input id="register-email" type="email" name="email" required autocomplete="email" aria-describedby="register-email-error" />
            <label for="register-password">Password</label>
            <input id="register-password" type="password" name="password" required minlength="8" autocomplete="new-password" />
            <div id="register-email-error" role="alert" hidden></div>
            <button class="btn btn-primary" type="submit" data-cta-click="Create Account">Create account</button>
          </form>

          <form id="login-form" class="auth-form" hidden novalidate>
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email" required autocomplete="email" />
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password" required autocomplete="current-password" />
            <button class="btn btn-primary" type="submit" data-cta-click="Login">Log in</button>
          </form>

          <p class="auth-note">
            By continuing, you agree to our <a href="privacy.html">Privacy Policy</a>.
          </p>
        </article>
      </section>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/cookie-banner-component.js"></script>
    <script src="assets/js/consent.js"></script>
    <script src="assets/js/analytics-ga4.js"></script>
    <script src="assets/js/meta-pixel.js"></script>
    <script src="assets/js/analytics.js"></script>
    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
